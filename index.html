<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Shortener</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Turn long links into short URLs</h1>
        <p>Paste a long URL and generate a short link instantly.</p>

        <form id="shortenForm">
          <div>
            <input
              id="longUrl"
              name="longUrl"
              type="url"
              placeholder="https://example.com/very/long/link"
              required
            />
            <button type="submit">Shorten</button>
          </div>
        </form>

        <section id="result">
          <div>Your shortened link will appear here.</div>
        </section>
      </section>
    </main>

    <script>
      const form = document.getElementById("shortenForm");
      const input = document.getElementById("longUrl");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const longUrl = input.value.trim();
        
        if (!longUrl) {
          result.innerHTML = "<div>Please enter a long URL first.</div>";
          return;
        }

        result.innerHTML = "<div>Creating your short link...</div>";
      });
    </script>
  </body>
</html>
