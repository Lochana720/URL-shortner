<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Shortener</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --bg-accent: #dbe7ff;
        --card: rgba(255, 255, 255, 0.82);
        --card-border: rgba(15, 23, 42, 0.08);
        --text: #0f172a;
        --muted: #475569;
        --primary: #0f766e;
        --primary-hover: #115e59;
        --primary-soft: #ccfbf1;
        --danger: #b91c1c;
        --shadow: 0 24px 80px rgba(15, 23, 42, 0.16);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(219, 231, 255, 0.9), transparent 36%),
          radial-gradient(circle at top right, rgba(204, 251, 241, 0.9), transparent 28%),
          linear-gradient(180deg, #faf8f2 0%, var(--bg) 100%);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(720px, 100%);
        position: relative;
      }

      .orb {
        position: absolute;
        inset: auto auto -60px -40px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: rgba(15, 118, 110, 0.12);
        filter: blur(8px);
        z-index: 0;
      }

      .card {
        position: relative;
        z-index: 1;
        background: var(--card);
        border: 1px solid var(--card-border);
        backdrop-filter: blur(18px);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: clamp(24px, 5vw, 40px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 1.02;
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 14px 0 0;
        font-size: 1.04rem;
        line-height: 1.6;
        color: var(--muted);
        max-width: 58ch;
      }

      form {
        margin-top: 28px;
        display: grid;
        gap: 14px;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      input[type="url"] {
        width: 100%;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 18px;
        padding: 16px 18px;
        font-size: 1rem;
        color: var(--text);
        background: rgba(255, 255, 255, 0.88);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      input[type="url"]::placeholder {
        color: #94a3b8;
      }

      input[type="url"]:focus {
        border-color: rgba(15, 118, 110, 0.55);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        transform: translateY(-1px);
      }

      button {
        border: 0;
        border-radius: 18px;
        padding: 16px 22px;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--primary), #0ea5a0);
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(15, 118, 110, 0.22);
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        white-space: nowrap;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 34px rgba(15, 118, 110, 0.28);
        filter: saturate(1.05);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        cursor: progress;
        opacity: 0.72;
        box-shadow: none;
      }

      .hint {
        margin: 0;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .result {
        margin-top: 22px;
        min-height: 88px;
        padding: 18px;
        border-radius: 20px;
        background: rgba(248, 250, 252, 0.92);
        border: 1px solid rgba(15, 23, 42, 0.08);
        display: grid;
        align-items: center;
      }

      .result.empty {
        color: #64748b;
      }

      .result.success {
        background: linear-gradient(180deg, rgba(236, 253, 245, 0.96), rgba(240, 253, 250, 0.96));
        border-color: rgba(15, 118, 110, 0.16);
      }

      .result.error {
        background: linear-gradient(180deg, rgba(254, 242, 242, 0.96), rgba(255, 247, 247, 0.96));
        border-color: rgba(185, 28, 28, 0.16);
        color: var(--danger);
      }

      .label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #64748b;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .short-link {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary);
        word-break: break-all;
      }

      .short-link a {
        color: inherit;
        text-decoration: none;
      }

      .short-link a:hover {
        text-decoration: underline;
      }

      .status {
        font-size: 0.98rem;
        line-height: 1.5;
      }

      @media (max-width: 640px) {
        .input-row {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="orb" aria-hidden="true"></div>
      <section class="card" aria-labelledby="title">
        <div class="eyebrow">URL Shortener</div>
        <h1 id="title">Turn long links into a short, shareable URL.</h1>
        <p class="subtitle">
          Paste a long URL, generate a short code, and get back the live short link from your Cloudflare Worker.
        </p>

        <form id="shortenForm" novalidate>
          <div class="input-row">
            <input
              id="longUrl"
              name="longUrl"
              type="url"
              inputmode="url"
              placeholder="https://example.com/very/long/link"
              autocomplete="off"
              required
            />
            <button id="submitBtn" type="submit">Shorten</button>
          </div>
          <p class="hint">Your Worker will save the mapping and return a short URL.</p>
        </form>

        <section id="result" class="result empty" aria-live="polite">
          <div class="status">Your shortened link will appear here.</div>
        </section>
      </section>
    </main>

    <script>
      const form = document.getElementById("shortenForm");
      const input = document.getElementById("longUrl");
      const submitBtn = document.getElementById("submitBtn");
      const result = document.getElementById("result");

      const workerEndpoint = "https://url-shortener.yourname.workers.dev/shorten";
      const baseShortUrl = "https://url-shortener.yourname.workers.dev";

      function setResult({ type, title, message, link }) {
        result.className = `result ${type || "empty"}`;

        if (link) {
          result.innerHTML = `
            <div>
              <div class="label">Short URL</div>
              <div class="short-link"><a href="${link}" target="_blank" rel="noreferrer">${link}</a></div>
              <div class="status" style="margin-top: 8px; color: #475569;">${message || "Ready to open or copy."}</div>
            </div>
          `;
          return;
        }

        result.innerHTML = `<div class="status">${message}</div>`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const longUrl = input.value.trim();
        if (!longUrl) {
          setResult({ type: "error", message: "Please enter a long URL first." });
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Shortening...";
        setResult({ message: "Creating your short link..." });

        try {
          const response = await fetch(workerEndpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ longUrl }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.error || "Unable to shorten the URL.");
          }

          const shortCode = data.shortCode;
          if (!shortCode) {
            throw new Error("The worker did not return a short code.");
          }

          const shortUrl = `${baseShortUrl.replace(/\/$/, "")}/${shortCode}`;
          setResult({
            type: "success",
            link: shortUrl,
            message: "Your short URL is ready.",
          });
        } catch (error) {
          setResult({
            type: "error",
            message: error instanceof Error ? error.message : "Something went wrong.",
          });
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Shorten";
        }
      });
    </script>
  </body>
</html>
