<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Shortener</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #f4f1ea 0%, #faf8f2 100%); }
      body { display: grid; place-items: center; padding: 24px; }
      main { width: min(720px, 100%); }
      section { background: rgba(255, 255, 255, 0.82); border: 1px solid rgba(15, 23, 42, 0.08); backdrop-filter: blur(18px); border-radius: 24px; padding: 40px; box-shadow: 0 24px 80px rgba(15, 23, 42, 0.16); }
      h1 { font-size: 2.2rem; margin: 0 0 14px; line-height: 1.2; letter-spacing: -0.02em; }
      p { margin: 0 0 28px; font-size: 1rem; color: #475569; }
      form { display: grid; gap: 14px; }
      div { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
      input { border: 1px solid rgba(15, 23, 42, 0.12); border-radius: 18px; padding: 16px 18px; font-size: 1rem; outline: none; transition: 0.2s; }
      input:focus { border-color: rgba(15, 118, 110, 0.55); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12); }
      button { border: 0; border-radius: 18px; padding: 16px 22px; font-size: 1rem; font-weight: 700; color: white; background: linear-gradient(135deg, #0f766e, #0ea5a0); cursor: pointer; transition: 0.2s; box-shadow: 0 14px 30px rgba(15, 118, 110, 0.22); }
      button:hover { transform: translateY(-1px); box-shadow: 0 18px 34px rgba(15, 118, 110, 0.28); }
      #result { margin-top: 22px; padding: 18px; border-radius: 20px; background: rgba(248, 250, 252, 0.92); border: 1px solid rgba(15, 23, 42, 0.08); }
      @media (max-width: 640px) { div { grid-template-columns: 1fr; } button { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Turn long links into short URLs</h1>
        <p>Paste a long URL and generate a short link instantly.</p>

        <form id="shortenForm">
          <div>
            <input
              id="longUrl"
              name="longUrl"
              type="url"
              placeholder="https://example.com/very/long/link"
              required
            />
            <button type="submit">Shorten</button>
          </div>
        </form>

        <section id="result">
          <div>Your shortened link will appear here.</div>
        </section>
      </section>
    </main>

    <script>
      const form = document.getElementById("shortenForm");
      const input = document.getElementById("longUrl");
      const result = document.getElementById("result");
      const submitBtn = form.querySelector("button");

      const workerEndpoint = "https://url-shortener.yourname.workers.dev/shorten";
      const baseShortUrl = "https://url-shortener.yourname.workers.dev";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const longUrl = input.value.trim();
        
        if (!longUrl) {
          result.innerHTML = "<div style='color: #b91c1c;'>Please enter a long URL first.</div>";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Shortening...";
        result.innerHTML = "<div>Creating your short link...</div>";

        try {
          const response = await fetch(workerEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ longUrl }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.error || "Unable to shorten the URL.");
          }

          const shortCode = data.shortCode;
          if (!shortCode) throw new Error("No short code returned.");

          const shortUrl = `${baseShortUrl}/${shortCode}`;
          result.innerHTML = `
            <div style='color: #0f766e;'>
              <div style='font-size: 0.8rem; text-transform: uppercase; color: #64748b; margin-bottom: 8px;'>Short URL</div>
              <div style='font-size: 1.1rem; font-weight: 700; word-break: break-all;'><a href="${shortUrl}" target="_blank" rel="noreferrer">${shortUrl}</a></div>
            </div>
          `;
        } catch (error) {
          result.innerHTML = `<div style='color: #b91c1c;'>${error instanceof Error ? error.message : "Something went wrong."}</div>`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Shorten";
        }
      });
    </script>
  </body>
</html>
